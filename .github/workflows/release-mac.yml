name: Release macOS stable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_PROFILE: trae-pet-ci

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e '
            const version = require("./package.json").version;
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== `v${version}`) throw new Error(`Tag ${tag} does not match v${version}`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/trae-pet-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials "$APPLE_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"
          echo "APPLE_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "BUILD_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build, sign and notarize stable release
        run: npm run release:mac:stable

      - name: Verify release bundle
        run: |
          npm run release:verify
          npm run verify:mac-signing
          shasum -a 256 -c release/final/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRAE-Pet-${{ github.ref_name }}-mac-stable
          path: release/final/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/final/* \
            --verify-tag \
            --generate-notes \
            --title "TRAE Pet $GITHUB_REF_NAME"

      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${BUILD_KEYCHAIN_PATH:-}" ] && [ -f "$BUILD_KEYCHAIN_PATH" ]; then
            security default-keychain -d user -s login.keychain-db || true
            security delete-keychain "$BUILD_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"
